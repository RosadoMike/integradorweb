services:
  - type: web
    name: campolisto-pwa
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
    disk:
      name: campolisto-reportes
      mountPath: /opt/render/project/src/data
      sizeGB: 1
